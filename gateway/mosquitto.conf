# Broker local Mosquitto del Gateway Raspberry Pi — Equipo 4, Challenge #3
# Crear usuarios (no versionar el archivo de claves):
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd nodo01
#   sudo mosquitto_passwd    /etc/mosquitto/passwd gateway

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.conf

persistence true
persistence_location /var/lib/mosquitto/
max_queued_messages 1000
connection_messages true
log_type warning
log_type error
log_type notice
