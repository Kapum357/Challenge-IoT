# ACL por nodo: cada ESP32 solo escribe en su rama agua/<nodo_id>/... y solo lee su comando.
# %u = nombre de usuario MQTT, que debe coincidir con el nodo_id.
pattern write agua/%u/telemetria
pattern write agua/%u/alerta
pattern write agua/%u/estado
pattern write agua/%u/confirmacion
pattern read  agua/%u/comando

# El Gateway lee todo el arbol y publica comandos y recomendaciones de IA.
user gateway
topic readwrite agua/#
